name: "Defined Gate"

# Reusable consumer template: run the defined gate against any repo.
# Consumer repos call this via a gitsha-pinned ref:
#
#   jobs:
#     quality:
#       uses: markstanden/defined/.github/workflows/defined--verify.yml@<shortsha>
#
# The image tag comes from the repo's committed .defined-version — the same
# pin the local `defined` launcher reads — so local green = merge green by
# construction. Release identity is immutable: the workflow ref SHA and the
# .defined-version pin must match (see PLAN.md). The pipeline verb is always
# read-only `verify`; `comply` is the local/agent loop, never CI.

on:
    workflow_call:

jobs:
    defined-gate:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

            - name: Read image pin
              id: pin
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ ! -f .defined.json ]]; then
                    echo "::error::no .defined.json in the repo root — commit one (see PLAN.md release identity)"
                    exit 1
                  fi
                  PIN="$(jq -r '.version // empty' .defined.json)"
                  if [[ -z "${PIN}" ]]; then
                    echo "::error::.defined.json is missing the version field — it must hold an immutable image tag"
                    exit 1
                  fi
                  if [[ "${PIN}" == "latest" ]]; then
                    echo "::error::.defined.json must pin an immutable tag, not 'latest'"
                    exit 1
                  fi
                  if [[ ! "${PIN}" =~ ^[0-9a-f]{7,40}$ ]]; then
                    echo "::error::.defined.json has an invalid pin '${PIN}' — expected a git SHA"
                    exit 1
                  fi
                  echo "pin=${PIN}" >> "$GITHUB_OUTPUT"

            - name: Run defined gate
              env:
                  IMAGE: ghcr.io/markstanden/defined:${{ steps.pin.outputs.pin }}
              shell: bash
              run: |
                  set -euo pipefail

                  REPO_ROOT="$(git -C "${GITHUB_WORKSPACE}" rev-parse --show-toplevel)"

                  docker run --rm \
                    -v "${REPO_ROOT}:/repo:ro" \
                    -e "NUGET_PACKAGES=/root/.nuget/packages" \
                    --workdir /repo \
                    "${IMAGE}" verify
