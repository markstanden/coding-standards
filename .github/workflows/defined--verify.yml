name: "Defined Gate"

# Reusable consumer template: run the defined gate against any repo.
# Consumer repos call this via a gitsha-pinned ref:
#
#   jobs:
#     quality:
#       uses: markstanden/coding-standards/.github/workflows/defined--verify.yml@<shortsha>
#       with:
#         image-tag: <shortsha>   # match the pinned ref for full reproducibility
#
# The image tag IS the release: publish the image and pin this workflow to the
# same commit short-sha so local green = merge green by construction. The
# pipeline verb is always read-only `verify` — `comply` is the local/agent
# loop, never CI.

on:
    workflow_call:
        inputs:
            image-tag:
                description: >-
                    Tag of the ghcr.io/markstanden/defined image to run. Pin to the
                    commit short-sha of the workflow ref (or a published tool-pin hash
                    for a stable toolchain with the current gate code).
                type: string
                required: true

jobs:
    defined-gate:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

            - name: Run defined gate
              env:
                  IMAGE: ghcr.io/markstanden/defined:${{ inputs.image-tag }}
              shell: bash
              run: |
                  set -euo pipefail

                  REPO_ROOT="$(git -C "${GITHUB_WORKSPACE}" rev-parse --show-toplevel)"

                  docker run --rm \
                    -v "${REPO_ROOT}:/repo" \
                    -e "NUGET_PACKAGES=/root/.nuget/packages" \
                    --workdir /repo \
                    "${IMAGE}" verify
