name: "Unit Tests"
on:
  workflow_call:
    inputs:

      dotnet-version:
        type: string
        default: '9.0.x'
        description: '.NET SDK version to use'

      test-name:
        type: string
        default: 'Unit Tests'
        description: 'Name for the test job (e.g., "Unit Tests")'

      collect-coverage:
        type: boolean
        default: false
        description: 'Whether to collect and upload code coverage.'

      test-filter:
        type: string
        default: '(Category!=Integration&Category!=Acceptance)&(FullyQualifiedName!~Integration.Tests&FullyQualifiedName!~Acceptance.Tests)'  # yamllint disable-line rule:line-length
        description: >-
          Filter selecting which tests to run. Defaults exclude projects named
          `*Integration.Tests`/`*Acceptance.Tests` and individual tests marked
          `[Trait("Category", "Integration")]` or `[Trait("Category", "Acceptance")]`

      artifact-name:
        type: string
        default: "build-output"
        description: "Name of the build artifact to download."

      debug-output:
        description: "Enable verbose debug output to aid troubleshooting"
        type: boolean
        required: false
        default: false

jobs:
  unit-tests:
    uses: "./.github/workflows/dotnet-test--common-test-runner.yml"
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      test-name: ${{ inputs.test-name }}
      test-filter: ${{ inputs.test-filter }}
      artifact-name: ${{ inputs.artifact-name }}
      collect-coverage: ${{ inputs.collect-coverage }}
      debug-output: ${{ inputs.debug-output }}
