name: "Healthcheck - cURL Endpoint Check"
on:
    workflow_call:
        inputs:
            image-tag:
                description: >-
                    Tag of the ghcr.io/markstanden/defined image to run. The image bakes
                    curl — the healthcheck loop runs in-container. Pin to the commit
                    short-sha of the workflow ref.
                type: string
                required: true

            base-url:
                description: "Base URL to test"
                type: string
                required: true

            routes:
                description: "JSON array of routes to test"
                type: string
                required: true

            timeout:
                description: "Request timeout in seconds"
                type: number
                required: false
                default: 30

            retries:
                description: "Number of retries per endpoint"
                type: number
                required: false
                default: 5

            retry-delay:
                description: "Delay between retries in seconds"
                type: number
                required: false
                default: 5

            debug-output:
                description: "Enable verbose debug output to aid troubleshooting"
                type: boolean
                required: false
                default: false

defaults:
    run:
        shell: bash

jobs:
    healthcheck:
        name: "Healthcheck Endpoints"
        runs-on: "ubuntu-latest"
        container:
            image: ghcr.io/markstanden/defined:${{ inputs.image-tag }}
        steps:
            - name: "Test endpoints"
              env:
                  BASE_URL: "${{ inputs.base-url }}"
                  ROUTES_ARRAY: "${{ inputs.routes }}"
                  MAX_TIMEOUT: ${{ inputs.timeout }}
                  RETRY_ATTEMPTS: ${{ inputs.retries }}
                  RETRY_DELAY: ${{ inputs.retry-delay }}
              run: node /opt/defined/pipelines/healthcheck-verify.mts
