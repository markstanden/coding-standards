name: "Playwright Test Runner"
on:
    workflow_call:
        inputs:
            image-tag:
                description: >-
                    Tag of the ghcr.io/markstanden/defined image to run. The image bakes
                    the pinned .NET SDK — no setup-dotnet step needed. Pin to the commit
                    short-sha of the workflow ref.
                type: string
                required: true

            test-filter:
                type: string
                required: false
                default: "FullyQualifiedName~Tests"
                description: "Filter for selecting which tests to run."

            test-name:
                type: string
                required: false
                default: "End-to-End Tests"
                description: "Name for the test job (e.g., 'End-to-End Tests')"

            test-project-path:
                type: string
                required: true
                description: "Path to the test project directory for Playwright Tests."

            debug-output:
                description: "Enable verbose debug output to aid troubleshooting"
                type: boolean
                required: false
                default: false

            base-url:
                type: string
                required: true
                description: "Base URL for the application under test"

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
    run:
        shell: bash

jobs:
    run-tests:
        name: ${{ inputs.test-name }}
        runs-on: "ubuntu-latest"
        container:
            image: ghcr.io/markstanden/defined:${{ inputs.image-tag }}
        steps:
            - name: "Checkout repository"
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

            - name: "Cache NuGet packages"
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
              continue-on-error: true
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            - name: "Restore dependencies"
              run: dotnet restore

            - name: "Build test project for Playwright"
              run: dotnet build
              working-directory: ${{ inputs.test-project-path }}

            - name: "Install Playwright CLI"
              run: dotnet tool install --global Microsoft.Playwright.CLI

            - name: "Verify Playwright CLI installation"
              if: inputs.debug-output == true
              run: playwright --version
              working-directory: ${{ inputs.test-project-path }}

            - name: "Compute Playwright cache key"
              id: pwver
              env:
                  PROJECT_DIR: ${{ inputs.test-project-path }}
              run: node /opt/defined/pipelines/dotnet-playwright-version.mts

            - name: "Cache Playwright browsers"
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
              continue-on-error: true
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-ms-playwright-${{ steps.pwver.outputs.version || hashFiles(format('{0}/packages.lock.json', inputs.test-project-path), format('{0}/**/*.csproj', inputs.test-project-path)) }} # yamllint disable-line rule:line-length
                  restore-keys: |
                      ${{ runner.os }}-ms-playwright-

            - name: "Install Playwright browsers"
              run: playwright install --with-deps
              working-directory: ${{ inputs.test-project-path }}

            - name: "Output BASE_URL for debugging"
              if: inputs.debug-output == true
              env:
                  BASE_URL: ${{ inputs.base-url }}
              run: echo "BASE_URL=$BASE_URL"

            - name: "Run Tests"
              id: run_tests
              env:
                  BASE_URL: ${{ inputs.base-url }}
                  TEST_PROJECT_PATH: ${{ inputs.test-project-path }}
                  TEST_FILTER: ${{ inputs.test-filter }}
              continue-on-error: true
              run: dotnet test "$TEST_PROJECT_PATH" --filter "$TEST_FILTER" --no-build --verbosity normal # yamllint disable-line rule:line-length

            - name: "Add test summary"
              if: always()
              env:
                  SUMMARY_HEADING: ${{ inputs.test-name }} Results
                  SUMMARY_STATUS: ${{ steps.run_tests.outcome }}
              run: node /opt/defined/pipelines/dotnet-summary.mts

            - name: "Check for test failures"
              if: steps.run_tests.outcome == 'failure'
              run: exit 1
