name: "Deploy static site to Azure SWA"

on:
    workflow_call:
        inputs:
            image-tag:
                description: >-
                    Tag of the ghcr.io/markstanden/defined image to run. The image bakes
                    node — the pipeline modules run in-container, so no setup-node step
                    is needed. Pin to the commit short-sha of the workflow ref.
                type: string
                required: true

            environment:
                description: "Deployment environment (e.g. staging, production)"
                type: string
                required: true

            frontend-artifact-name:
                description: "Name of the frontend build artifact"
                type: string
                required: true

            infrastructure-outputs-artifact-name:
                description: "Artifact containing infrastructure outputs"
                type: string
                required: true

            concurrency-group:
                description: "Concurrency group for SWA deployment"
                type: string
                required: false
                default: ""

            output-json-filename:
                description: "Filename for the infrastructure outputs JSON file"
                type: string
                required: false
                default: "tofu_outputs.json"

            swa-token-output-key:
                description: "Key name in infrastructure outputs for SWA token"
                type: string
                required: false
                default: "azure_static_web_app_api_token"

            app-location:
                description: "Folder containing the prebuilt static site (relative to workspace root)"
                type: string
                required: false
                default: "dist"

            config-file-location:
                description: "Folder containing staticwebapp.config.json (relative to workspace root)"
                type: string
                required: false
                default: "swa"

            swa-action:
                description: "Static Web App action (upload/close)"
                type: string
                required: false
                default: "upload"

            debug-output:
                description: "Enable verbose debug output to aid troubleshooting"
                type: boolean
                required: false
                default: false

        outputs:
            deployment-url:
                description: "Deployed application URL"
                value: ${{ jobs.deploy.outputs.url }}

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
    run:
        shell: bash

jobs:
    deploy:
        name: "Deploy to ${{ inputs.environment }}"
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/markstanden/defined:${{ inputs.image-tag }}
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
            actions: read
        outputs:
            url: ${{ steps.parse_url.outputs.url }}
        concurrency:
            group: "${{ inputs.concurrency-group || inputs.environment }}"
            cancel-in-progress: true
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

            - name: Download infrastructure outputs
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: ${{ inputs.infrastructure-outputs-artifact-name }}

            - name: Parse infrastructure outputs
              id: parse_outputs
              env:
                  OUTPUT_FILENAME: ${{ inputs.output-json-filename }}
                  TOKEN_KEY: ${{ inputs.swa-token-output-key }}
                  URL_KEY: static_web_app_url
              run: node /opt/defined/pipelines/azure-swa-parse-outputs.mts

            - name: Download frontend artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: ${{ inputs.frontend-artifact-name }}
                  path: ${{ inputs.app-location }}

            - name: Debug build folder
              if: inputs.debug-output
              working-directory: ${{ inputs.app-location }}
              run: |
                  pwd
                  ls -lah
                  find . -maxdepth 2 -type f | head -40

            - name: Deploy to Azure Static Web App
              id: deploy
              uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
              with:
                  azure_static_web_apps_api_token: ${{ steps.parse_outputs.outputs.token }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: ${{ inputs.swa-action }}
                  app_location: ${{ inputs.app-location }}
                  config_file_location: ${{ inputs.config-file-location }}
                  output_location: ""
                  skip_app_build: true

            - name: Resolve deployment URL
              id: parse_url
              env:
                  SWA_URL: ${{ steps.deploy.outputs.static_web_app_url }}
                  OUTPUTS_URL: ${{ steps.parse_outputs.outputs.url }}
              run: node /opt/defined/pipelines/azure-swa-resolve-url.mts
