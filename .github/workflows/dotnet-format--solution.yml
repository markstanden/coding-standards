name: "Code Formatting"
on:
  workflow_call:
    inputs:

      dotnet-version:
        type: string
        default: "9.0.x"
        description: "The .NET SDK version to use"

      debug-output:
        description: "Enable verbose debug output to aid troubleshooting"
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    name: "Code Formatting Standards Compliance Check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: "Setup .NET"
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: "Cache NuGet packages"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Check .NET format"
        run: dotnet format --verify-no-changes --verbosity detailed

      - name: "Add format summary"
        if: always()
        run: |
          {
            echo "### Format Check Results"
            if [ "${{ job.status }}" == 'success' ]; then
              echo "Code meets formatting standards"
            else
              echo "Code formatting issues detected"
              echo "Run \`dotnet format\` locally with the correct \`.editorconfig\`"
              echo "to meet required standards."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
