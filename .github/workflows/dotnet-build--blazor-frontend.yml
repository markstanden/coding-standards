name: "Build Blazor Frontend"
on:
  workflow_call:
    inputs:
      image-tag:
        description: >-
          Tag of the ghcr.io/markstanden/defined image to run. The image bakes
          the pinned .NET SDK and Node — no setup-dotnet/setup-node steps
          needed. Pin to the commit short-sha of the workflow ref.
        type: string
        required: true

      web-project-path:
        description: "Path to the web project directory"
        type: string
        required: false
        default: "src/Web"

      artifact-name:
        description: "Name for the uploaded artifact"
        type: string
        required: false
        default: "frontend-build"

      retention-days:
        description: "Number of days to retain the artifact"
        type: number
        required: false
        default: 30

      environment-variables:
        description: >-
          Environment variables for the build process
          (JSON format: {"KEY1":"value1","KEY2":"value2"})
        type: string
        required: false
        default: ""

      debug-output:
        description: "Enable verbose debug output to aid troubleshooting"
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  build-frontend:
    name: "Build Frontend Artifact"
    runs-on: "ubuntu-latest"
    container:
      image: ghcr.io/markstanden/defined:${{ inputs.image-tag }}
    permissions:
      contents: read
      actions: write  # needed to save caches
    steps:
      - name: "Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: "Set environment variables"
        if: inputs.environment-variables != ''
        env:
          ENV_JSON: ${{ inputs.environment-variables }}
        run: node /opt/defined/pipelines/dotnet-env-json.mts

      - name: "Check for npm requirements"
        id: check-npm
        env:
          WEB_PROJECT_PATH: ${{ inputs.web-project-path }}
        run: node /opt/defined/pipelines/dotnet-check-npm.mts

      - name: "Install npm dependencies"
        if: steps.check-npm.outputs.npm-required == 'true'
        working-directory: ${{ inputs.web-project-path }}
        run: npm ci

      - name: "Cache NuGet packages"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Restore dependencies"
        env:
          WEB_PROJECT_PATH: ${{ inputs.web-project-path }}
        run: dotnet restore "$WEB_PROJECT_PATH"

      - name: "Build"
        env:
          WEB_PROJECT_PATH: ${{ inputs.web-project-path }}
        run: dotnet build "$WEB_PROJECT_PATH" --no-restore --configuration Release

      - name: "Publish"
        env:
          WEB_PROJECT_PATH: ${{ inputs.web-project-path }}
        run: dotnet publish "$WEB_PROJECT_PATH" --no-restore --configuration Release --output ./publish

      - name: "Upload build artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          path: ./publish
          retention-days: ${{ inputs.retention-days }}
