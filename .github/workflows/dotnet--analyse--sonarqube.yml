name: SonarQube
on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: "9.0.x"
        description: ".NET SDK version to use"

      sonar-project-key:
        required: true
        type: string
        description: "SonarQube project key"

      sonar-org:
        required: true
        type: string
        description: "SonarQube organization"

      sonar-exclusions:
        required: false
        type: string
        default: "**/.playwright/**,**/test-results/**,**/playwright-report/**,**/playwright/.cache/**,**/bin/**,**/obj/**"  # yamllint disable-line rule:line-length
        description: "Files/directories to exclude from analysis"

      debug-output:
        description: "Enable verbose debug output to aid troubleshooting"
        type: boolean
        required: false
        default: false

    secrets:

      SONAR_TOKEN:
        required: true
        description: "SonarQube token"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: "Build and analyze"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Set up JDK 17"
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: 17
          distribution: "zulu"

      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: "Setup .NET"
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: "Cache NuGet packages"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Cache SonarQube Cloud packages"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: "Cache SonarQube Cloud scanner"
        id: cache-sonar-scanner
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: "Install SonarQube Cloud scanner"
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: "Build and analyze"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          SONAR_ORG: ${{ inputs.sonar-org }}
          SONAR_EXCLUSIONS: ${{ inputs.sonar-exclusions }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORG" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.exclusions="$SONAR_EXCLUSIONS"
          dotnet build
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
