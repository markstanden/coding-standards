name: "Common Test Runner"
on:
  workflow_call:
    inputs:
      image-tag:
        description: >-
          Tag of the ghcr.io/markstanden/defined image to run. The image bakes
          the pinned .NET SDK — no setup-dotnet step needed. Pin to the commit
          short-sha of the workflow ref.
        type: string
        required: true

      test-filter:
        type: string
        required: false
        default: "FullyQualifiedName~Tests"
        description: "Filter for selecting which tests to run."

      test-name:
        type: string
        required: false
        default: "All Tests"
        description: "Name for the test job (e.g., 'All Tests')"

      collect-coverage:
        type: boolean
        required: false
        default: false
        description: "Whether to collect and upload code coverage."

      artifact-name:
        type: string
        required: false
        default: "build-output"
        description: "Name of the build artifact to download."

      debug-output:
        description: "Enable verbose debug output to aid troubleshooting"
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  run-tests:
    name: ${{ inputs.test-name }}
    runs-on: "ubuntu-latest"
    container:
      image: ghcr.io/markstanden/defined:${{ inputs.image-tag }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: "Cache NuGet packages"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Download build artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact-name }}

      - name: "Output debug information"
        if: inputs.debug-output == true
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
          TEST_NAME: ${{ inputs.test-name }}
          COLLECT_COVERAGE: ${{ inputs.collect-coverage }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          echo "--- Debug Information ---"
          echo "Test filter: $TEST_FILTER"
          echo "Test name: $TEST_NAME"
          echo "Collect coverage: $COLLECT_COVERAGE"
          echo "Artifact name: $ARTIFACT_NAME"
          echo ""
          echo "--- Downloaded Artifact Contents ---"
          pwd
          ls -laR
          echo ""
          echo "--- .NET Info ---"
          dotnet --info
          echo ""
          echo "--- Solution/Project Files ---"
          find . -name "*.sln" -o -name "*.csproj" | head -20

      - name: "Restore dependencies"
        run: dotnet restore

      - name: "Run Tests"
        id: run_tests
        continue-on-error: true
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
          COLLECT_COVERAGE: ${{ inputs.collect-coverage }}
        run: node /opt/defined/pipelines/dotnet-test.mts

      - name: "Upload coverage reports to Codecov"
        if: inputs.collect-coverage == true && steps.run_tests.outcome == 'success'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          directory: ./coverage
          fail_ci_if_error: false

      - name: "Add test summary"
        if: always()
        env:
          SUMMARY_HEADING: ${{ inputs.test-name }} Results
          SUMMARY_STATUS: ${{ steps.run_tests.outcome }}
        run: node /opt/defined/pipelines/summary.mts

      - name: "Check for test failures"
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
