name: Build
on:
  workflow_call:
    inputs:

      dotnet-version:
        type: string
        default: '9.0.x'
        description: '.NET SDK version to use'

      debug-output:
        description: "Enable verbose debug output to aid troubleshooting"
        type: boolean
        required: false
        default: false

    outputs:

      build_success:
        description: "Indicates if the project builds successfully"
        value: ${{ jobs.build.outputs.success }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.build_step.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: "Cache NuGet packages"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        id: build_step
        continue-on-error: true
        run: dotnet build

      - name: Upload build artifacts
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-output
          path: |
            **/bin

      - name: Add build summary
        if: always()
        run: |
          echo "### Build Results" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build_step.outcome }}" == 'success' ]; then
            echo "Build successful" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Check for build failures"
        if: steps.build_step.outcome == 'failure'
        run: exit 1
