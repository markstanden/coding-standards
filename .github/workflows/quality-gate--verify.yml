name: "Quality Gate"

# Reusable consumer template: run the portable quality gate against any repo.
# Consumer repos call this via a gitsha-pinned ref:
#
#   jobs:
#     quality:
#       uses: markstanden/coding-standards/.github/workflows/quality-gate--verify.yml@<shortsha>
#       with:
#         image-tag: <shortsha>   # match the pinned ref for full reproducibility
#
# The image tag IS the release: publish the image and pin this workflow to the
# same commit short-sha so local green = merge green by construction.

on:
  workflow_call:
    inputs:
      image-tag:
        description: >-
          Tag of the ghcr.io/markstanden/quality-gate image to run. Pin to the
          commit short-sha of the workflow ref (or a published tool-pin hash
          for a stable toolchain with the current gate code).
        type: string
        required: true

      fix:
        description: "Run the gate in --fix mode (rewrites files in the checkout)."
        type: boolean
        required: false
        default: false

      silent:
        description: "Pass --silent to the gate for log-style output."
        type: boolean
        required: false
        default: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run quality gate
        env:
          IMAGE: ghcr.io/markstanden/quality-gate:${{ inputs.image-tag }}
          FIX: ${{ inputs.fix }}
          SILENT: ${{ inputs.silent }}
        shell: bash
        run: |
          set -euo pipefail

          ARGS=()
          if [[ "${FIX}" == "true" ]]; then
            ARGS+=("--fix")
          fi
          if [[ "${SILENT}" == "true" ]]; then
            ARGS+=("--silent")
          fi

          REPO_ROOT="$(git -C "${GITHUB_WORKSPACE}" rev-parse --show-toplevel)"

          docker run --rm \
            -v "${REPO_ROOT}:/repo" \
            -e "NUGET_PACKAGES=/root/.nuget/packages" \
            --workdir /repo \
            "${IMAGE}" "${ARGS[@]}"
