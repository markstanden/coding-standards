name: "Build Node Frontend"

on:
    workflow_call:
        inputs:
            node-version:
                description: "Node.js version"
                type: string
                required: false
                default: "22"

            frontend-project-path:
                description: "Path to the npm project directory (relative to repository root)"
                type: string
                required: false
                default: "frontend"

            install-command:
                description: "Shell command to install dependencies"
                type: string
                required: false
                default: "npm ci"

            build-command:
                description: "Shell command to build the frontend"
                type: string
                required: false
                default: "npm run build"

            output-directory:
                description: "Build output directory (relative to frontend-project-path)"
                type: string
                required: false
                default: "dist"

            artifact-prefix:
                description: "Prefix for the uploaded artifact name"
                type: string
                required: false
                default: "frontend-release"

            retention-days:
                description: "Artifact retention days"
                type: number
                required: false
                default: 7

            cache-dependency-path:
                description: "Path to package-lock.json for npm cache"
                type: string
                required: false
                default: "package-lock.json"

            debug-output:
                description: "Enable verbose debug output to aid troubleshooting"
                type: boolean
                required: false
                default: false

        outputs:
            artifact-name:
                description: "Name of the frontend build artifact"
                value: "${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}"

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build-frontend:
        name: "Build Node Frontend"
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: npm
                  cache-dependency-path: ${{ inputs.cache-dependency-path }}

            - name: Install dependencies
              working-directory: ${{ inputs.frontend-project-path }}
              env:
                  INSTALL_CMD: ${{ inputs.install-command }}
              run: bash -c "$INSTALL_CMD"

            - name: Build
              working-directory: ${{ inputs.frontend-project-path }}
              env:
                  BUILD_CMD: ${{ inputs.build-command }}
              run: bash -c "$BUILD_CMD"

            - name: Debug build output
              if: inputs.debug-output
              working-directory: ${{ inputs.frontend-project-path }}/${{ inputs.output-directory }}
              run: |
                  pwd
                  find . -maxdepth 2 -type f | head -40

            - name: Upload build artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: ${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ inputs.frontend-project-path }}/${{ inputs.output-directory }}
                  if-no-files-found: error
                  retention-days: ${{ inputs.retention-days }}
