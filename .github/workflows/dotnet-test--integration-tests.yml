name: "Integration Tests"
on:
  workflow_call:
    inputs:
      image-tag:
        description: >-
          Tag of the ghcr.io/markstanden/defined image to run. Passed through to
          the common test runner. Pin to the commit short-sha of the workflow ref.
        type: string
        required: true

      collect-coverage:
        type: boolean
        default: false
        description: "Whether to collect and upload code coverage."

      test-name:
        type: string
        default: "Integration Tests"
        description: "Name for the test job (e.g., 'Integration Tests')"

      test-filter:
        type: string
        default: "Category=Integration|FullyQualifiedName~Integration.Tests"
        description: "Filter for selecting which tests to run."

      artifact-name:
        type: string
        default: "build-output"
        description: "Name of the build artifact to download."

      debug-output:
        description: "Enable verbose debug output to aid troubleshooting"
        type: boolean
        required: false
        default: false

jobs:
  integration-tests:
    uses: "./.github/workflows/dotnet-test--common-test-runner.yml"
    with:
      image-tag: ${{ inputs.image-tag }}
      test-name: ${{ inputs.test-name }}
      test-filter: ${{ inputs.test-filter }}
      artifact-name: ${{ inputs.artifact-name }}
      collect-coverage: ${{ inputs.collect-coverage }}
      debug-output: ${{ inputs.debug-output }}
