name: "Publish Quality Gate Image"

on:
  push:
    branches: [main]
    paths:
      - "quality/**"
  workflow_dispatch:

concurrency:
  group: quality-gate-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: quality-gate

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Compute tag hashes
        id: hashes
        shell: bash
        run: |
          echo "pinhash=$(sha256sum quality/container/tool-versions.env | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "shortsha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read tool pins
        id: pins
        shell: bash
        run: |
          set -a
          # shellcheck source=quality/container/tool-versions.env
          source quality/container/tool-versions.env
          set +a
          echo "node_tag=${NODE_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "node_digest=${NODE_IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: quality/
          file: quality/container/Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_IMAGE_TAG=${{ steps.pins.outputs.node_tag }}
            NODE_IMAGE_DIGEST=${{ steps.pins.outputs.node_digest }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.hashes.outputs.pinhash }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.hashes.outputs.shortsha }}
