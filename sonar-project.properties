# SonarQube Cloud project identity — no secrets here (tokens live in CI secrets).
# Consumed by the sonar-scanner for the standalone analysis path. Keep
# sonar.projectKey in step with .sonarlint/connectedMode.json and the badge in
# the README.
sonar.projectKey=markstanden_defined
sonar.organization=markstanden
sonar.sources=.

# Files matching these patterns are test files: still analyzed for issues, but
# not counted in the coverage metric. .test.mts files and test-only scaffolding
# (helpers/fixture) would otherwise show as source with 0% coverage.
sonar.test.inclusions=**/*.test.mts,**/test-helpers.mts,**/lib/fixture.mts

# Tool configs travelling in the image (prettier/yamllint) are not gate source.
sonar.exclusions=runtime/config/**

# JS/TS coverage: the gate's own node-coverage step writes this lcov report
# (self-hosted). SonarQube consumes it verbatim — generated by comply.sh, read
# by the scanner, no re-formatting needed.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
