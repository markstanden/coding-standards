name: Code Quality Pipeline
on:
    pull_request:
        branches: ["main", "dev", "prod"]
    push:
        branches: ["main", "dev", "prod"]

jobs:
    quality:
        name: Defined Quality Gate
        # The one consumer-facing gate workflow; pin to a published short-sha.
        # Local green = pipeline green by construction.
        uses: markstanden/defined/.github/workflows/defined--verify.yml@<shortsha>
        with:
            image-tag: <shortsha>
